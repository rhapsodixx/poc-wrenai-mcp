version: 1.3.15
cache: true
interface:
  mcpServers:
    use: true
    create: false
    share: false
    public: false
mcpServers:
  wren:
    type: streamable-http
    # Path-token route, not the bearer header: LibreChat probes the URL unauthenticated to detect OAuth
    # and treats Caddy's 401 as "OAuth required", which disables the server. Same reason ChatGPT uses /t/.
    url: https://wren.kamisamanosumopod.my.id/t/${WREN_MCP_TOKEN}/mcp
    timeout: 60000
    serverInstructions: true
