name: groups
table_reference:
  catalog: ''
  schema: public
  table: groups
properties:
  description: Engineering teams (Backend, Frontend, DevOps, Data, Quality, Product, Engineering, External). One row per team.
columns:
- name: id
  type: UUID
  not_null: true
- name: name
  type: TEXT
  not_null: true
  properties:
    description: Team name.
- name: color
  type: TEXT
  not_null: true
  properties:
    description: Hex colour used by the dashboard.
- name: created_at
  type: TIMESTAMPTZ
  not_null: true
- name: updated_at
  type: TIMESTAMPTZ
  not_null: true
primary_key: id
