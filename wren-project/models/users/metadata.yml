name: users
table_reference:
  catalog: ''
  schema: public
  table: users
properties:
  description: Dashboard login accounts (Supabase Auth). Not team members; empty today.
columns:
- name: id
  type: UUID
  not_null: true
- name: auth_id
  type: UUID
  not_null: true
  properties:
    description: Supabase Auth user id.
- name: name
  type: TEXT
  not_null: true
- name: email
  type: TEXT
  not_null: true
- name: role
  type: TEXT
  not_null: true
  properties:
    description: Application role.
- name: last_login
  type: TIMESTAMPTZ
- name: created_at
  type: TIMESTAMPTZ
  not_null: true
- name: updated_at
  type: TIMESTAMPTZ
  not_null: true
primary_key: id
